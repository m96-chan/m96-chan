name: Update 3D Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *'   # Daily at 00:00 UTC
  workflow_dispatch:        # Manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate 3D Contribution Graph
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
          GITHUB_USERNAME: m96-chan
          OUTPUT_FILE: contribution-3d.svg
        run: python scripts/generate_contribution_3d.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution-3d.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update 3D contribution graph [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
